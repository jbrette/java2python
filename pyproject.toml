[project]
name = "java2python"
version = "0.6.0"
description = "Simple but effective tool to translate Java source code into Python."
readme = "readme.md"
license = "LGPL-2.1-or-later"
license-files = ["license.txt", "java2python/lang/antlr3/LICENSE"]
authors = [{ name = "Troy Melhase", email = "troy@troy.io" }]
requires-python = ">=3.14"
keywords = ["java", "java2python", "compiler"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Java",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/natural/java2python"

[project.scripts]
j2py = "java2python.cli:main"

[dependency-groups]
# zope.interface is imported by the generated code in test/ (see test/configs/defaults.py).
dev = ["zope.interface"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "java2python"
module-root = ""
